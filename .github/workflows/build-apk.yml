
name: Build Hazard 7007 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

        - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses


      - name: Unpack Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q Hazard7007-Android-project.zip -d android-project

      - name: Find Gradle project
        run: |
          find android-project -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hazard7007-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
